services:
  api:
    hostname: 'cars-api'
    build: .
    restart: unless-stopped
    networks:
      - cars-backend
      - backends
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      # Внутри сети слушает 80: так его ждёт nginx фронтенда (cars-api:80).
      SERVER_PORT: 80
    volumes:
      - ./data:/usr/app/data
    expose:
      - 80
    mem_limit: 256m
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    # База маленькая, а сервер общий: по умолчанию кэш занял бы полпамяти.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backends
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo:

networks:
  # Общая с фронтендом: его nginx ходит сюда как на cars-api.
  cars-backend:
    external: true
  backends:
