services:
  api:
    hostname: 'cars-api'
    build: .
    restart: unless-stopped
    networks:
      - cars-backend
      - sms-provider-network
    env_file:
      - .env
    volumes:
      - ./data:/usr/app/data
    expose:
      - 80
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8
    hostname: 'cars-redis'
    restart: unless-stopped
    networks:
      - cars-backend
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


networks:
  cars-backend:
    external: true
  sms-provider-network:
    external: true