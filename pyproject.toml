[project]
name = "cars-backend"
version = "0.1.0"
description = "GeorgianCars API"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "beanie~=2.1.0",
    "fastapi~=0.136.1",
    "pillow>=12.2.0",
    "pydantic~=2.13.3",
    "pydantic-settings~=2.14.0",
    "pymongo~=4.17.0",
    "pyrofork>=2.3.69",
    "tgcrypto>=1.2.5",
    "uvicorn[standard]~=0.46.0",
    "uvloop~=0.22.1 ; sys_platform == 'darwin' or sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff~=0.15.12",
    "ty~=0.0.34",
]
